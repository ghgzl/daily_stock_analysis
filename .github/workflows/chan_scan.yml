name: 中证500三买扫描

on:
  # 定时触发 - 每周五 17:00（北京时间）= UTC 09:00（收盘后扫描）
  schedule:
    - cron: '0 9 * * 5'
  # 手动触发（随时可点 Run workflow）
  workflow_dispatch:

concurrency:
  group: chan-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖（chan.py 引擎精简依赖）
        run: |
          python -m pip install --upgrade pip
          pip install akshare yfinance "pandas>=2.0,<3" "numpy<3" matplotlib requests python-dotenv markdown2 --quiet

      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 60))

      - name: 运行中证500三买扫描
        env:
          SCAN_UNIVERSE: cs500
          SCAN_START: 2004-01-01
          SCAN_LIMIT: '0'
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || '股票分析助手' }}
        run: |
          echo "=========================================="
          echo "🎯 缠论三类买点扫描（chan.py · 中证500）"
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          python chan_scan.py

      - name: 上传扫描报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chan-scan-report-${{ github.run_number }}
          path: |
            chan_scan_report.md
            chan_img/
          retention-days: 30

      - name: 显示运行结果
        if: always()
        run: |
          echo "=========================================="
          echo "📊 扫描结果"
          echo "=========================================="
          if [ -f "chan_scan_report.md" ]; then
            head -40 chan_scan_report.md
          else
            echo "⚠️ 未生成报告文件"
          fi
